<style>
:root{--bg:#FAFAF7;--panel:#fff;--hi:#EFEDE6;--ink:#17171A;--mute:#8B8B92;--line:#E7E5DD;--acc:#4D699B;--aink:#fff;--good:#2E8B63;--bad:#C84053}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0B;--panel:#111113;--hi:#1A1A1E;--ink:#E9E9EB;--mute:#6C6C73;--line:#1D1D21;--acc:#7E9CD8;--aink:#0A0A0B;--good:#5FB38A;--bad:#E0626B}}
:root[data-theme="dark"]{--bg:#0A0A0B;--panel:#111113;--hi:#1A1A1E;--ink:#E9E9EB;--mute:#6C6C73;--line:#1D1D21;--acc:#7E9CD8;--aink:#0A0A0B;--good:#5FB38A;--bad:#E0626B}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;font-weight:700;transition:background .35s,color .35s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:1200px;margin:0 auto;padding:18px 14px 90px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;animation:fade .5s both}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;flex:none;animation:stamp .6s .1s cubic-bezier(.2,.9,.3,1.4) both}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.15}
h1 span{color:var(--mute);font-weight:700}
.sub{font-size:15px;color:var(--mute);margin-top:3px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ib,.pill{height:42px;border-radius:8px;background:var(--hi);display:grid;place-items:center;transition:background .2s,transform .15s}
.ib{width:42px;font-size:22px}
.pill{padding:0 16px;font-size:16px;font-weight:800}
.ib:hover,.pill:hover{background:var(--line)}
.ib:active,.pill:active{transform:scale(.93)}
.wk{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--mute);margin:0 6px}
.sw{width:34px;height:20px;border-radius:10px;background:var(--hi);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:transform .25s,background .25s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(14px);background:var(--aink)}
.seg2{display:flex;gap:2px}
.seg2 button{padding:0 15px;height:42px;border-radius:8px;font-size:16px;font-weight:800;color:var(--mute);transition:background .2s,color .2s}
.seg2 button.on{background:var(--hi);color:var(--ink)}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.drawer.open{grid-template-rows:1fr}
.drawer>div{overflow:hidden}
.setup{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--panel);border-radius:10px;padding:14px;margin-bottom:14px;border:1px solid var(--line)}
label{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;gap:5px}
input[type=time],input[type=text]{font:inherit;font-weight:700;color:var(--ink);background:var(--hi);border:2px solid transparent;border-radius:8px;padding:7px 9px;outline:0;color-scheme:dark light;transition:border-color .2s}
input:focus{border-color:var(--acc)}
.chips{display:flex;gap:5px}
.chip{width:40px;height:40px;border-radius:50%;background:var(--hi);display:grid;place-items:center;font-size:15px;font-weight:800;transition:background .2s}
.chip.on{background:var(--acc);color:var(--aink)}
.pri{background:var(--acc);color:var(--aink)}.pri:hover{background:var(--acc);filter:brightness(1.1)}
.pill.off,.chip.on.o{background:#E6C384;color:#0B0B0E}.pill.off:hover{background:#E6C384;filter:brightness(1.1)}
.dows,.grid{display:grid}
.dow{text-align:center;font-size:16px;font-weight:800;color:color-mix(in srgb,var(--ink) 65%,transparent);padding:12px 0}
.dow .s{display:none}
.grid{gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{position:relative;min-height:142px;padding:12px 10px;background:transparent;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;animation:fade .45s both;animation-delay:calc(var(--i)*12ms);transition:background .2s}
.cell>*{position:relative;z-index:1}
.cell:hover{background:var(--panel)}
.cell.has{background:color-mix(in srgb,var(--c) 14%,transparent)}
.cell.has:hover{background:color-mix(in srgb,var(--c) 24%,var(--bg))}
.cell::after{content:"+";position:absolute;right:9px;bottom:6px;color:var(--mute);opacity:0;transition:opacity .2s;font-size:16px}
.cell:hover::after{opacity:1}
.cell.today::before{content:"";position:absolute;inset:3px;border-radius:10px;background:color-mix(in srgb,var(--c,transparent) 20%,var(--hi))}
.n{font-size:18px;font-weight:800}
.today .n::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1.8s ease-in-out infinite}
.out .n,.out .r{opacity:.4}
.r{display:flex;align-items:center;gap:8px;font-size:16px;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:7px;padding:5px 8px}
.r b{font-weight:800;flex:1;white-space:nowrap}
.r em{font-style:normal;color:color-mix(in srgb,var(--ink) 75%,transparent);font-size:14px;font-weight:700;white-space:nowrap}
.r em.g{color:var(--good)}
.ic{width:19px;height:19px;border-radius:5px;background:var(--c,var(--acc));color:var(--aink);font-size:12px;font-style:normal;display:grid;place-items:center;flex:none}
.ic.h{background:linear-gradient(90deg,var(--mute) 50%,transparent 50%);border:1px solid var(--mute)}
.r.m span{flex:1;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid.w .cell{min-height:240px}.grid.d .cell{min-height:320px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.ov.show{opacity:1;visibility:visible}
.modal{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;transform:translateY(18px) scale(.97);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.ov.show .modal{transform:none}
.modal h3{margin:0 0 14px;font-size:27px;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.row label{flex:1}.modal input{width:100%}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;height:44px;border-radius:8px;background:var(--hi);font-size:16px;font-weight:800}
.seg button.on{background:var(--acc);color:var(--aink)}
.sw3{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.sq{width:36px;height:36px;border-radius:50%;font-size:14px;display:grid;place-items:center;transition:transform .2s}
.sq:hover{transform:scale(1.15)}.sq.on{outline:2px solid var(--ink);outline-offset:2px}
.hrs{font-size:16px;color:var(--mute);margin:2px 0 14px}
.btns{display:flex;gap:8px}.btns button{height:44px;padding:0 18px;border-radius:8px;background:var(--hi);font-size:16px;font-weight:800}
.ck{display:none;position:absolute;right:8px;top:8px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--mute);z-index:2;font-style:normal;font-size:10px;line-height:13px;text-align:center;color:var(--aink)}
.selmode .ck{display:block}.selmode .cell::after{display:none}
.cell.sel{outline:2px solid var(--acc);outline-offset:-2px}
.cell.sel .ck{background:var(--acc);border-color:var(--acc)}.cell.sel .ck::after{content:"✓"}
.pill.on{background:var(--acc);color:var(--aink)}
.selbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;z-index:8;opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .25s;white-space:nowrap}
.selbar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.selbar span{font-size:16px;font-weight:700;margin-right:4px}

#cf{z-index:10}.cfm{margin:0 0 20px;font-size:17px;line-height:1.7}
.tx{position:absolute;inset:0;z-index:0;pointer-events:none;background:var(--c);opacity:.24;-webkit-mask-image:var(--texu);mask-image:var(--texu);-webkit-mask-size:var(--texw) auto;mask-size:var(--texw) auto;-webkit-mask-repeat:repeat;mask-repeat:repeat}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.arr{position:sticky;top:calc(50vh - 30px);width:60px;height:60px;border-radius:50%;background:var(--hi);font-size:40px;line-height:1;display:grid;place-items:center;padding-bottom:6px;transition:background .2s,transform .15s}
.arr:hover{background:var(--acc);color:var(--aink)}.arr:active{transform:scale(.92)}
#sheet{position:relative;perspective:1800px}
.pg{position:absolute;left:0;right:0;top:0;overflow:hidden;background:var(--bg);transform-origin:50% 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;z-index:5;pointer-events:none;will-change:transform}
.pg *{animation:none!important}
.pg.up{animation:pgup .85s cubic-bezier(.5,0,.3,1) forwards}
.pg.down{animation:pgdown .85s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes pgup{from{transform:rotateX(0);filter:brightness(1)}to{transform:rotateX(-105deg);filter:brightness(.5)}}
@keyframes pgdown{from{transform:rotateX(-105deg);filter:brightness(.5)}to{transform:rotateX(0);filter:brightness(1)}}
.sync{font-size:13px;color:var(--mute);margin-top:3px;display:flex;align-items:center;gap:7px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.sync[data-s=ok]::before{background:var(--good)}.sync[data-s=bad]::before{background:var(--bad)}
.sync[data-s=busy]::before{background:var(--acc);animation:pulse 1s infinite}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-25deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- fit-to-screen, wider, compact, responsive ---- */
:root{--rowmin:80px}
.app{max-width:1760px;margin:0 auto;padding:12px 16px 14px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.selmode .app{padding-bottom:88px}
.bar{margin-bottom:10px}
.logo{width:40px;height:40px}
h1{font-size:clamp(22px,3vw,30px)}
.sub{font-size:13px;margin-top:1px}.sync{font-size:12px;margin-top:1px}
.ib,.pill,.seg2 button{height:38px}.ib{width:38px;font-size:20px}
.pill{padding:0 14px;font-size:15px}.seg2 button{padding:0 14px;font-size:15px}
.wk{font-size:13px}
.setup{padding:10px 12px;gap:10px;margin-bottom:10px}
.setup input[type=time]{padding:5px 8px}
.chip{width:34px;height:34px;font-size:13px}
label{font-size:11px}
.dow{font-size:14px;padding:6px 0}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:stretch}
.arr{position:static;align-self:center;width:52px;height:52px;font-size:34px;padding-bottom:5px}
#sheet{display:flex;flex-direction:column;min-height:0}
.grid{flex:1;min-height:0}
.pg{display:flex;flex-direction:column}
.cell{container-type:inline-size;min-height:0;padding:8px 9px;gap:4px}
.grid.w .cell,.grid.d .cell{min-height:0}
.n{font-size:clamp(12px,7.5cqw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{font-size:clamp(10px,6.5cqw,14px);padding:3px 6px;gap:6px;border-radius:6px}
.r b{overflow:hidden;text-overflow:ellipsis}
.r em{font-size:clamp(10px,6cqw,13px)}
.ic{width:17px;height:17px;font-size:11px}
.ck{width:14px;height:14px;right:6px;top:6px}
.si{display:none}
@container (max-width:179px){.rg{display:none}.si{display:flex}}
@container (max-width:124px){.tl{display:none}.r .ic,.r b{display:none}.r{padding:2px;gap:0}.r em{flex:1;text-align:center;white-space:normal;line-height:1.1;font-size:clamp(9.5px,10cqw,12px)}.r.m span{display:none}}
@media(max-width:700px){
  :root{--texw:48px;--rowmin:74px}
  .app{padding:8px 4px 10px}
  .bar{padding:0 4px;gap:8px;margin-bottom:8px}
  .logo{width:32px;height:32px}h1{font-size:22px}
  .ctl{gap:6px;width:100%}
  .ib,.pill,.seg2 button{height:36px}.pill{padding:0 11px;font-size:14px}.seg2 button{padding:0 10px;font-size:14px}
  .wk span{display:none}.wk{margin:0 2px}
  .setup{padding:8px;gap:8px}
  .stage{grid-template-columns:22px minmax(0,1fr) 22px;gap:2px}
  .arr{width:22px;height:60px;border-radius:7px;font-size:26px;padding:0 0 4px}
  .dow .f{display:none}.dow .s{display:inline}.dow{font-size:12px;padding:5px 0}
  .cell{padding:6px 3px;gap:3px}
  .cell::after{display:none}
  .selbar{max-width:calc(100vw - 16px);padding:6px 6px 6px 10px;gap:6px}
  .selbar span{font-size:14px}
  .modal{padding:16px}
}
.sync{cursor:pointer}
.sbbox{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border-top:1px dashed var(--line);padding-top:10px}.sbbox[hidden]{display:none}.sbbox label{flex:1 1 200px}.sbbox input{width:100%}
.modal{max-width:560px;max-height:92dvh;overflow:auto}
#tkBox{margin:4px 0 12px}
.tkr{display:grid;grid-template-columns:minmax(0,1fr) 108px 108px 36px;gap:6px;margin:6px 0}
.tkr input{width:100%;padding:6px 8px}
.tkr .x{min-height:36px;border-radius:8px;background:var(--hi)}
.tkr.b input[type=text]{font-weight:800}
.tkbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tkbtns button{height:36px;padding:0 12px;border-radius:8px;background:var(--hi);font-weight:800;font-size:14px}
@media(max-width:700px){.tkr{grid-template-columns:1fr 1fr 36px}.tkr input[type=text]{grid-column:1/-1}}
.grid.quiet .cell{animation:none!important}
.tp{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:7;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(105%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility .4s;overflow-y:auto}
.tp.open{transform:none;visibility:visible}
.tph{display:flex;justify-content:space-between;align-items:center}.tph h3{margin:0;font-size:24px;font-weight:800}

.tp{overflow:hidden}
.tpl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.sl{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.sl .tm{font-size:13px;font-weight:700;color:var(--mute);line-height:1.3}
.sl .tm b{display:block;color:var(--ink);font-size:15px;font-weight:800}
.sl input{width:100%;min-width:0;padding:11px 12px;font-size:15px}
.sl.fx .fl{display:grid;place-items:center;min-height:44px;border-radius:8px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:800;letter-spacing:.16em;font-size:14px}

<script>
const $=s=>document.querySelector(s);
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],MS=MN.map(m=>m.slice(0,3)),DF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],DS=DF.map(d=>d.slice(0,3));
let S={duties:{},def:{in:'08:00',out:'17:00'},wd:[1,2,3,4,5],owd:[0,6],name:'HARVEY WADE GONZALES',pos:'GRAPHIC ARTIST/IT',wk:true,mode:'m'};
try{const r=localStorage.getItem('duty-cal-v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{persist();scheduleSync()};
let theme='dark';try{theme=localStorage.getItem('duty-theme')||'dark'}catch(e){}
const setTheme=t=>{theme=t;document.documentElement.dataset.theme=t;try{localStorage.setItem('duty-theme',t)}catch(e){}};
setTheme(theme);$('#tgl').onclick=()=>setTheme(theme==='dark'?'light':'dark');

let cur=new Date(),editing=null,mType='duty',mColor=null,sel=new Set(),selMode=false,bulk=false;
const PAL=[null,'#E6C384','#98BB6C','#7AA89F','#957FB8','#FFA066','#E46876'],OFFC='#E6C384';
const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const hrs=(i,o)=>(i&&o)?((mins(o)-mins(i)+1440)%1440)/60:0;
const fh=h=>(Number.isInteger(h)?h:h.toFixed(1))+'h';
const f12=t=>{let[h,m]=t.split(':').map(Number);const s=h>=12?'PM':'AM';return (h%12||12)+':'+pad(m)+' '+s};
const mon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x};
const esc=s=>s.replace(/</g,'&lt;');

function dates(){
  const y=cur.getFullYear(),m=cur.getMonth(),out=[];
  if(S.mode==='d')return[new Date(y,m,cur.getDate())];
  let a,b;
  if(S.mode==='w'){a=mon(cur);b=new Date(a);b.setDate(a.getDate()+6)}
  else{a=mon(new Date(y,m,1));b=new Date(y,m+1,0);b.setDate(b.getDate()+(6-b.getDay()))}
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))if(S.wk||(d.getDay()%6))out.push(new Date(d));
  return out;
}
function render(){
  const y=cur.getFullYear(),m=cur.getMonth(),ds=dates(),now=new Date(),M=S.mode;
  let tM,tY=y;
  if(M==='m')tM=MN[m];
  else if(M==='w'){const a=mon(cur),b=new Date(a);b.setDate(a.getDate()+6);tM=MS[a.getMonth()]+' '+a.getDate()+' – '+(b.getMonth()!==a.getMonth()?MS[b.getMonth()]+' ':'')+b.getDate()}
  else tM=DF[cur.getDay()]+', '+MS[m]+' '+cur.getDate();
  $('#tM').textContent=tM;$('#tY').textContent=tY;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===M));
  $('#wk').classList.toggle('on',S.wk);$('#wk').style.opacity=M==='d'?.4:1;
  $('#defIn').value=S.def.in;$('#defOut').value=S.def.out;$('#dtrName').value=S.name;$('#dtrPos').value=S.pos;
  $('#chips').innerHTML=[0,1,2,3,4,5,6].map(i=>`<button class="chip ${S.wd.includes(i)?'on':''}" data-i="${i}">${DS[i][0]}</button>`).join('');

    put('O6','Task-out',{size:15,bold:true}).fill=PINK;
    for(let r=7;r<=last;r++){
      const sl=SLOTS[r-7],txt=sl?(sl.f||tk[r-7]||''):'';
      put('A'+r,txt||null,{size:11,bold:!!(sl&&sl.f)},{horizontal:'center'});
      put('N'+r,sl?mins(sl.i)/1440:null,{size:11},{horizontal:'left'}).numFmt='h:mm';
      put('O'+r,sl?mins(sl.o)/1440:null,{size:11},{horizontal:'left'}).numFmt='h:mm';
    }
    ['A1:O1','B2:O2','B3:O3','B4:O4','A5:O5'].forEach(r=>ws.mergeCells(r));
    for(let r=6;r<=last;r++)ws.mergeCells('A'+r+':M'+r);
  });
  return wb.xlsx.writeBuffer();
}
async function saveFile(name,buf){
  try{if(window.claude&&claude.use){const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:buf});return}}}
  catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
async function exportDTR(list,label){
  const days=list.filter(k=>{const v=S.duties[k];return v&&!v.off&&nt(v)>0}).sort();
  if(!days.length)return ask('No tasks to export','Open the Tasks panel and type your tasks for a day first. Days without tasks are skipped.','',true);
  if(!await ask('Export DTR to Excel?',plural(days.length,'day')+' from '+label+', one sheet per day in your DTR layout.','Export'))return;
  try{
    const buf=await buildDTR(days.map(k=>[k,S.duties[k]]));
    const f=days[0].split('-');
    await saveFile(days.length===1?`DTR_${MS[+f[1]-1]}-${+f[2]}-${f[0]}.xlsx`:`DTR_${label.replace(/\s+/g,'-')}.xlsx`,buf);
  }catch(e){ask('Export failed',(e&&e.message)||'Something went wrong building the file.','',true)}
}
$('#dtrBtn').onclick=()=>{const y=cur.getFullYear(),m=cur.getMonth(),p=key(new Date(y,m,1)).slice(0,8);exportDTR(Object.keys(S.duties).filter(k=>k.startsWith(p)),MN[m]+' '+y)};
$('#selDtr').onclick=()=>{if(sel.size)exportDTR([...sel],'your selection')};
$('#dtrName').onchange=e=>{S.name=e.target.value.trim()||S.name;save()};
$('#dtrPos').onchange=e=>{S.pos=e.target.value.trim()||S.pos;save()};

/* ---- Tasks panel ---- */
let quiet=false;
const rq=()=>{quiet=true;render();quiet=false};
let tpDate=key(new Date()),tpT=null;
const dOf=k=>new Date(k+'T00:00:00');
function tpHead(){
  const v=S.duties[tpDate],dt=dOf(tpDate);
  const st=!v?'Not plotted yet. Typing a task plots it as a duty day ('+f12(S.def.in)+' – '+f12(S.def.out)+').':v.off?'This day is marked as a day off.':'Duty '+f12(v.in)+' – '+f12(v.out)+' · '+plural(nt(v),'task');
  $('#tpStatus').textContent=DF[dt.getDay()]+', '+MN[dt.getMonth()]+' '+dt.getDate()+' · '+st;
}
function tpDraw(){
  const v=S.duties[tpDate],off=!!(v&&v.off),tk=(v&&!v.off&&v.tk)||[],dis=off?' disabled':'';
  $('#tpDate').value=tpDate;tpHead();
  let h=off?'<div class="tps" style="padding:6px 0 10px">Make it a duty day to type tasks. <button class="pill" id="tpMake">Make duty day</button></div>':'';
  SLOTS.forEach((sl,r)=>{
    const tm=`<div class="tm"><b>${f12(sl.i)}</b>to ${f12(sl.o)}</div>`;
    h+=sl.f?`<div class="sl fx">${tm}<div class="fl">${sl.f}</div></div>`
      :`<div class="sl">${tm}<input type="text" data-r="${r}" value="${ea(tk[r]||'')}" placeholder="Type your task…" maxlength="120" aria-label="Task ${f12(sl.i)} to ${f12(sl.o)}"${dis}></div>`;
  });
  $('#tpList').innerHTML=h;
}
function tpSave(){
  let v=S.duties[tpDate];if(v&&v.off)return;
  const tk=SLOTS.map((sl,r)=>{const el=document.querySelector('#tpList input[data-r="'+r+'"]');return el?el.value.trim():''});
  clearTimeout(tpT);tpT=setTimeout(rq,400);
  if(!tk.some(x=>x)){if(v&&v.tk){delete v.tk;save();tpHead()}return}
  if(!v)v=S.duties[tpDate]={in:S.def.in,out:S.def.out,note:'',off:false,color:null};
  v.tk=tk;save();tpHead();
}
$('#tpList').oninput=e=>{if(e.target.dataset.r!==undefined)tpSave()};
$('#tpList').onkeydown=e=>{if(e.key==='Enter'&&e.target.dataset.r!==undefined){e.preventDefault();const all=[...document.querySelectorAll('#tpList input')],i=all.indexOf(e.target);if(all[i+1])all[i+1].focus()}};
$('#tpList').onclick=async e=>{
  if(e.target.id!=='tpMake')return;
  if(!await ask('Make this a duty day?','The day off will become a duty day ('+f12(S.def.in)+' – '+f12(S.def.out)+').','Make duty day'))return;
  S.duties[tpDate]={in:S.def.in,out:S.def.out,note:'',off:false,color:null};save();rq();tpDraw();
};
$('#tpCopy').onclick=async()=>{
  const ks=Object.keys(S.duties).filter(k=>k<tpDate&&!S.duties[k].off&&nt(S.duties[k])).sort();
  if(!ks.length)return ask('Nothing to copy','No earlier day has tasks yet.','',true);
  const cur=S.duties[tpDate];
  if(cur&&cur.off)return ask('This day is a day off','Make it a duty day first.','',true);
  if(nt(cur)&&!await ask('Replace this day\'s tasks?','Your tasks on this day will be replaced with the ones from '+ks[ks.length-1]+'.','Replace'))return;
  const v=cur||(S.duties[tpDate]={in:S.def.in,out:S.def.out,note:'',off:false,color:null});
  v.tk=clone(S.duties[ks[ks.length-1]].tk);save();rq();tpDraw();
};
$('#tpClear').onclick=async()=>{
  const v=S.duties[tpDate];if(!nt(v))return;
  if(!await ask('Clear all tasks?','This empties every task box on this day.','Clear tasks'))return;
  delete v.tk;save();rq();tpDraw();
};
const tpGo=k=>{tpDate=k||key(new Date());tpDraw()};
const tpShift=n=>{const d=dOf(tpDate);d.setDate(d.getDate()+n);tpGo(key(d))};
$('#tpDate').onchange=e=>tpGo(e.target.value);
$('#tpPrev').onclick=()=>tpShift(-1);$('#tpNext').onclick=()=>tpShift(1);$('#tpToday').onclick=()=>tpGo();
$('#tpBtn').onclick=()=>{const o=$('#tp').classList.toggle('open');if(o)tpDraw();$('#tpBtn').classList.toggle('on',o)};
$('#tpX').onclick=()=>{$('#tp').classList.remove('open');$('#tpBtn').classList.remove('on')};
$('#tpExDay').onclick=()=>{const d=dOf(tpDate);exportDTR([tpDate],MS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear())};
$('#tpExMonth').onclick=()=>{const d=dOf(tpDate),p=tpDate.slice(0,8);exportDTR(Object.keys(S.duties).filter(k=>k.startsWith(p)),MN[d.getMonth()]+' '+d.getFullYear())};
render();
connect();
</script>
</body>
