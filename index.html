<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duty Calendar · 勤務暦</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{--bg:#F2ECDC;--card:#FBF7EA;--card2:#E9E1CB;--ink:#1F1F28;--mute:#6B6A64;--accent:#4D699B;--aink:#FBF7EA;--seal:#C84053;--line:#D9D0B6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0E;--card:#15151B;--card2:#1E1E27;--ink:#DCD7BA;--mute:#727169;--accent:#7E9CD8;--aink:#0B0B0E;--seal:#E46876;--line:#2A2A37}}
:root[data-theme="dark"]{--bg:#0B0B0E;--card:#15151B;--card2:#1E1E27;--ink:#DCD7BA;--mute:#727169;--accent:#7E9CD8;--aink:#0B0B0E;--seal:#E46876;--line:#2A2A37}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-weight:700;transition:background .4s,color .4s}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
.disp{font-family:"Dela Gothic One","Zen Kaku Gothic New",Impact,sans-serif;font-weight:400}
header{position:relative;background:var(--card);border-radius:12px;overflow:hidden;padding:24px 22px 86px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transition:background .4s}
header .jp{font-size:12px;letter-spacing:.45em;color:var(--accent)}
header h1{margin:8px 0 0;font-size:clamp(30px,7vw,54px);line-height:1}
header h1 span{color:var(--accent)}
.wave{position:absolute;left:0;bottom:0;width:200%;height:64px;animation:drift 16s linear infinite}
.wave.b{height:54px;animation-duration:10s;animation-direction:reverse;opacity:.5}
.tgl{position:absolute;top:16px;right:16px;width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:20px;border-radius:50%;background:var(--card2)}
.tgl i{font-style:normal;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tgl.spin i{transform:rotate(180deg)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 12px}
.nav h2{margin:0;font-size:clamp(20px,5vw,32px)}
#title{display:inline-block}
#title.swap{animation:rise .35s ease both}
button{font:inherit;font-weight:900;cursor:pointer;color:var(--ink);background:var(--card2);border:0;border-radius:8px;padding:10px 16px;transition:transform .15s,background .2s,color .2s}
button:hover{background:var(--accent);color:var(--aink)}
button:active{transform:scale(.94)}
button.pri{background:var(--seal);color:#fff}
button.pri:hover{filter:brightness(1.12);background:var(--seal);color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{flex:1 1 130px;background:var(--card);border-radius:10px;padding:12px 16px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transition:background .4s}
.stat:nth-child(2){animation-delay:.08s}.stat:nth-child(3){animation-delay:.16s}.stat:nth-child(4){animation-delay:.24s}
.stat b{display:block;font-size:30px;font-family:"Dela Gothic One",sans-serif;font-weight:400;color:var(--accent)}
.stat span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.setup{background:var(--card);border-radius:10px;padding:16px;margin-bottom:16px;animation:rise .6s .22s cubic-bezier(.2,.8,.2,1) both;transition:background .4s}
.setup h3{margin:0 0 12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.row:last-child{margin-bottom:0}
label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;gap:5px}
input[type=time],input[type=text]{font:inherit;font-weight:700;color:var(--ink);background:var(--card2);border:2px solid transparent;border-radius:8px;padding:8px 10px;outline:0;transition:border-color .2s;color-scheme:dark light}
input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px}
.chip{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:50%}
.chip.on{background:var(--accent);color:var(--aink)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-size:12px;letter-spacing:.14em;padding:4px 0;color:var(--mute)}
.cell{position:relative;min-height:92px;padding:8px;background:var(--card);border-radius:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*16ms)}
.cell:hover{transform:translateY(-3px);background:var(--card2);color:var(--ink)}
.cell:active{transform:scale(.96)}
.cell.empty{visibility:hidden;animation:none}
.cell .n{font-family:"Dela Gothic One",sans-serif;font-size:18px;font-weight:400}
.cell.duty{background:var(--accent);color:var(--aink)}
.cell.duty:hover{background:var(--accent);filter:brightness(1.1);color:var(--aink)}
.cell.duty::after,.cell.off::after{content:"勤";position:absolute;right:6px;top:6px;background:var(--seal);color:#fff;width:20px;height:20px;font-size:12px;display:grid;place-items:center;border-radius:50%;animation:stamp .5s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--i)*16ms + .25s)}
.cell.today{outline:2px solid var(--seal);outline-offset:2px;animation:pop .5s cubic-bezier(.2,.8,.2,1) both,ring 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*16ms),.6s}
.cell.off::after{content:"休"}
.cell .t{font-size:12px;line-height:1.3}
.cell .h{font-size:11px;opacity:.85}
.cell .note{font-size:10px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.ov.show{opacity:1;visibility:visible}
.modal{width:100%;max-width:380px;background:var(--card);border-radius:14px;padding:20px;transform:translateY(20px) scale(.96);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.ov.show .modal{transform:none}
.modal h3{margin:0 0 14px;font-size:24px;color:var(--accent)}
.modal .row label{flex:1}
.modal input{width:100%}
.hrs{font-size:14px;margin:8px 0 16px;color:var(--mute)}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1}
.seg button.on{background:var(--accent);color:var(--aink)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sq{width:34px;height:34px;padding:0;border-radius:50%;font-size:13px;display:grid;place-items:center;transition:transform .2s}
.sq:hover{transform:scale(1.15)}
.sq.on{outline:2px solid var(--ink);outline-offset:2px}
.sig{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:28px}
.sig .ln{flex:1;height:2px;background:var(--line);transform-origin:left;animation:grow 1s .9s cubic-bezier(.2,.8,.2,1) both}
.sig .nm{font-size:clamp(26px,6vw,40px);letter-spacing:.14em;color:var(--accent);display:flex}
.sig .nm span{display:inline-block;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*.1s + 1.1s)}
.sig .hk{width:30px;height:30px;border-radius:50%;background:var(--seal);color:#fff;display:grid;place-items:center;font-size:15px;animation:stamp .5s 1.6s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes drift{to{transform:translateX(-50%)}}
@keyframes ring{50%{outline-offset:5px;outline-color:transparent}}
@media(max-width:560px){.cell{min-height:70px;padding:5px}.cell .note{display:none}.cell .n{font-size:15px}.cell .t{font-size:10px}.cell.duty::after,.cell.off::after{display:none}.row{gap:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="jp">勤務暦 ・ DUTY LOG</div>
  <h1 class="disp">DUTY <span>CALENDAR</span></h1>
  <button class="tgl" id="tgl" aria-label="Toggle light and dark mode"><i>◐</i></button>
  <svg class="wave b" viewBox="0 0 1600 54" preserveAspectRatio="none" aria-hidden="true"><path d="M0 54V30Q50 6 100 26T200 24T300 30T400 20T500 30T600 22T700 30T800 30Q850 6 900 26T1000 24T1100 30T1200 20T1300 30T1400 22T1500 30T1600 30V54Z" fill="var(--accent)"/></svg>
  <svg class="wave" viewBox="0 0 1600 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0 64V40Q40 10 90 34T180 30T270 38T360 26T450 38T540 24T630 38T720 28T800 40Q840 10 890 34T980 30T1070 38T1160 26T1250 38T1340 24T1430 38T1520 28T1600 40V64Z" fill="var(--accent)"/><g fill="var(--card)"><circle cx="90" cy="30" r="3"/><circle cx="102" cy="23" r="2"/><circle cx="360" cy="22" r="3"/><circle cx="540" cy="20" r="3"/><circle cx="890" cy="30" r="3"/><circle cx="902" cy="23" r="2"/><circle cx="1160" cy="22" r="3"/><circle cx="1340" cy="20" r="3"/></g></svg>
</header>

<div class="nav">
  <button id="prev" aria-label="Previous month">◀</button>
  <h2 class="disp"><span id="title"></span></h2>
  <button id="next" aria-label="Next month">▶</button>
</div>

<div class="stats">
  <div class="stat"><b id="sDays">0</b><span>Duty days</span></div>
  <div class="stat"><b id="sHrs">0h</b><span>Total hours</span></div>
  <div class="stat"><b id="sAvg">0h</b><span>Avg / day</span></div>
  <div class="stat"><b id="sOff">0</b><span>Days off</span></div>
</div>

<div class="setup">
  <h3>Setup · Default shift</h3>
  <div class="row">
    <label>Time in<input type="time" id="defIn"></label>
    <label>Time out<input type="time" id="defOut"></label>
    <label>Duty weekdays<div class="chips" id="chips"></div></label>
  </div>
  <div class="row">
    <button class="pri" id="fill">Fill this month</button>
    <button id="clear">Clear month</button>
    <button id="today">Today</button>
  </div>
</div>

<div class="grid" id="dows"></div>
<div class="grid" id="grid" style="margin-top:6px"></div>
<footer class="sig"><div class="ln"></div><div class="nm disp" aria-label="Wade"><span style="--d:0">W</span><span style="--d:1">A</span><span style="--d:2">D</span><span style="--d:3">E</span></div><div class="hk">印</div></footer>
</div>

<div class="ov" id="ov">
  <div class="modal">
    <h3 class="disp" id="mTitle"></h3>
    <div class="seg" id="seg"><button data-t="duty">Duty</button><button data-t="off">Day off</button></div>
    <div class="row">
      <label>Time in<input type="time" id="mIn"></label>
      <label>Time out<input type="time" id="mOut"></label>
    </div>
    <label style="margin-bottom:10px">Note<input type="text" id="mNote" placeholder="Ward 3, night shift…" maxlength="40"></label>
    <div class="hrs" id="mHrs"></div>
    <label style="margin-bottom:8px">Day color</label><div class="sw" id="sw"></div>
    <div class="row">
      <button class="pri" id="mSave">Save</button>
      <button id="mDel">Clear</button>
      <button id="mX">Close</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const DN=['S','M','T','W','T','F','S'], MN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
let S={duties:{},def:{in:'08:00',out:'17:00'},wd:[1,2,3,4,5]};
try{const r=localStorage.getItem('duty-cal-v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('duty-cal-v1',JSON.stringify(S))}catch(e){}};
let theme='dark';try{theme=localStorage.getItem('duty-theme')||'dark'}catch(e){}
const setTheme=t=>{theme=t;document.documentElement.dataset.theme=t;try{localStorage.setItem('duty-theme',t)}catch(e){}};
setTheme(theme);
$('#tgl').onclick=e=>{e.currentTarget.classList.toggle('spin');setTheme(theme==='dark'?'light':'dark')};

let view=new Date();view.setDate(1);let editing=null;
const key=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const hrs=(i,o)=>(i&&o)?((mins(o)-mins(i)+1440)%1440)/60:0;
const fh=h=>(Number.isInteger(h)?h:h.toFixed(1))+'h';
let mType='duty',mColor=null;
const PAL=[null,'#E6C384','#98BB6C','#7AA89F','#957FB8','#FFA066','#E46876'],OFFC='#E6C384';
const cellBg=v=>{const c=v.color||(v.off?OFFC:null);return c?`background:${c};color:#0B0B0E`:''};
const f12=t=>{let[h,m]=t.split(':').map(Number);const s=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+s};

function tween(el,to,fmt){
  const from=el._v||0;el._v=to;const t0=performance.now(),D=600;
  const step=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,3);
    el.textContent=fmt(p>=1?to:from+(to-from)*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function render(swap){
  const y=view.getFullYear(),m=view.getMonth();
  const T=$('#title');T.textContent=MN[m]+' '+y;
  if(swap){T.classList.remove('swap');void T.offsetWidth;T.classList.add('swap')}
  $('#defIn').value=S.def.in;$('#defOut').value=S.def.out;
  $('#chips').innerHTML=DN.map((d,i)=>`<button class="chip ${S.wd.includes(i)?'on':''}" data-i="${i}">${d}</button>`).join('');
  $('#dows').innerHTML=DN.map(d=>`<div class="dow">${d}</div>`).join('');
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),now=new Date();
  let html='',cnt=0,tot=0,off=0;
  for(let i=0;i<first;i++)html+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const k=key(y,m,d),v=S.duties[k];
    const isT=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===d;
    let inner=`<div class="n">${d}</div>`;
    if(v&&v.off){off++;inner+=`<div><div class="t">DAY OFF</div>${v.note?`<div class="note">${v.note.replace(/</g,'&lt;')}</div>`:''}</div>`}else if(v){const h=hrs(v.in,v.out);cnt++;tot+=h;
      inner+=`<div><div class="t">${f12(v.in)}<br>${f12(v.out)}</div><div class="h">${fh(h)}</div>${v.note?`<div class="note">${v.note.replace(/</g,'&lt;')}</div>`:''}</div>`}
    html+=`<button class="cell ${v?(v.off?'off':'duty'):''} ${isT?'today':''}" style="--i:${first+d};${v?cellBg(v):''}" data-k="${k}" data-d="${d}">${inner}</button>`;
  }
  $('#grid').innerHTML=html;
  tween($('#sDays'),cnt,v=>Math.round(v));
  tween($('#sHrs'),tot,fh);
  tween($('#sAvg'),cnt?tot/cnt:0,fh);
  tween($('#sOff'),off,v=>Math.round(v));
}
function openEd(k,d){
  editing=k;const v=S.duties[k]||{};mType=v.off?'off':'duty';mColor=v.color||null;
  $('#mTitle').textContent=MN[view.getMonth()].slice(0,3)+' '+d+', '+view.getFullYear();
  $('#mIn').value=v.in||S.def.in;$('#mOut').value=v.out||S.def.out;$('#mNote').value=v.note||'';
  upd();$('#ov').classList.add('show');
}
const upd=()=>{const off=mType==='off';
  $('#mHrs').textContent=off?'':'Shift length: '+fh(hrs($('#mIn').value,$('#mOut').value));
  $('#mHrs').style.display=off?'none':'';$('#mIn').closest('.row').style.display=off?'none':'';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===mType));
  $('#sw').innerHTML=PAL.map(c=>`<button class="sq ${c===mColor?'on':''}" data-c="${c||''}" style="background:${c||'var(--card2)'}" aria-label="Color">${c?'':'✕'}</button>`).join('')};
const close=()=>{$('#ov').classList.remove('show');editing=null};

$('#grid').onclick=e=>{const c=e.target.closest('.cell:not(.empty)');if(c)openEd(c.dataset.k,c.dataset.d)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const i=+b.dataset.i;
  S.wd=S.wd.includes(i)?S.wd.filter(x=>x!==i):[...S.wd,i];save();
  b.classList.toggle('on')};
$('#defIn').onchange=e=>{S.def.in=e.target.value;save()};
$('#defOut').onchange=e=>{S.def.out=e.target.value;save()};
$('#fill').onclick=()=>{const y=view.getFullYear(),m=view.getMonth(),dim=new Date(y,m+1,0).getDate();
  for(let d=1;d<=dim;d++)if(S.wd.includes(new Date(y,m,d).getDay())){const k=key(y,m,d);if(!S.duties[k])S.duties[k]={in:S.def.in,out:S.def.out,note:''}}
  save();render()};
$('#clear').onclick=()=>{const p=key(view.getFullYear(),view.getMonth(),1).slice(0,8);
  Object.keys(S.duties).forEach(k=>{if(k.startsWith(p))delete S.duties[k]});save();render()};
$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);render(1)};
$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);render(1)};
$('#today').onclick=()=>{view=new Date();view.setDate(1);render(1)};
$('#mIn').oninput=$('#mOut').oninput=upd;
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b){mType=b.dataset.t;upd()}};
$('#sw').onclick=e=>{const b=e.target.closest('.sq');if(b){mColor=b.dataset.c||null;upd()}};
$('#mSave').onclick=()=>{if(!editing)return;S.duties[editing]={in:$('#mIn').value,out:$('#mOut').value,note:$('#mNote').value.trim(),off:mType==='off',color:mColor};save();close();render()};
$('#mDel').onclick=()=>{if(editing){delete S.duties[editing];save()}close();render()};
$('#mX').onclick=close;
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
render();
</script>
</body>
</html>
