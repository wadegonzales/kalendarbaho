<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duty Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{--bg:#FAFAF7;--panel:#fff;--hi:#EFEDE6;--ink:#17171A;--mute:#8B8B92;--line:#E7E5DD;--acc:#4D699B;--aink:#fff;--good:#2E8B63;--bad:#C84053}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0B;--panel:#111113;--hi:#1A1A1E;--ink:#E9E9EB;--mute:#6C6C73;--line:#1D1D21;--acc:#7E9CD8;--aink:#0A0A0B;--good:#5FB38A;--bad:#E0626B}}
:root[data-theme="dark"]{--bg:#0A0A0B;--panel:#111113;--hi:#1A1A1E;--ink:#E9E9EB;--mute:#6C6C73;--line:#1D1D21;--acc:#7E9CD8;--aink:#0A0A0B;--good:#5FB38A;--bad:#E0626B}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-weight:500;transition:background .35s,color .35s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:1200px;margin:0 auto;padding:18px 14px 36px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;animation:fade .5s both}
h1{margin:0;font-size:clamp(20px,4vw,26px);font-weight:700}
h1 span{color:var(--mute);font-weight:500}
.sub{font-size:12px;color:var(--mute);margin-top:3px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ib,.pill{height:34px;border-radius:8px;background:var(--hi);display:grid;place-items:center;transition:background .2s,transform .15s}
.ib{width:34px;font-size:18px}
.pill{padding:0 12px;font-size:13px;font-weight:700}
.ib:hover,.pill:hover{background:var(--line)}
.ib:active,.pill:active{transform:scale(.93)}
.wk{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--mute);margin:0 6px}
.sw{width:34px;height:20px;border-radius:10px;background:var(--hi);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:transform .25s,background .25s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(14px);background:var(--aink)}
.seg2{display:flex;gap:2px}
.seg2 button{padding:0 13px;height:34px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mute);transition:background .2s,color .2s}
.seg2 button.on{background:var(--hi);color:var(--ink)}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.drawer.open{grid-template-rows:1fr}
.drawer>div{overflow:hidden}
.setup{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--panel);border-radius:10px;padding:14px;margin-bottom:14px;border:1px solid var(--line)}
label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;gap:5px}
input[type=time],input[type=text]{font:inherit;font-weight:700;color:var(--ink);background:var(--hi);border:2px solid transparent;border-radius:8px;padding:7px 9px;outline:0;color-scheme:dark light;transition:border-color .2s}
input:focus{border-color:var(--acc)}
.chips{display:flex;gap:5px}
.chip{width:34px;height:34px;border-radius:50%;background:var(--hi);display:grid;place-items:center;font-size:12px;font-weight:700;transition:background .2s}
.chip.on{background:var(--acc);color:var(--aink)}
.pri{background:var(--acc);color:var(--aink)}.pri:hover{background:var(--acc);filter:brightness(1.1)}
.pill.off,.chip.on.o{background:#E6C384;color:#0B0B0E}.pill.off:hover{background:#E6C384;filter:brightness(1.1)}
.dows,.grid{display:grid}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:10px 0}
.dow .s{display:none}
.grid{gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{position:relative;min-height:116px;padding:10px 8px;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:5px;animation:fade .45s both;animation-delay:calc(var(--i)*12ms);transition:background .2s}
.cell>*{position:relative;z-index:1}
.cell:hover{background:var(--panel)}
.cell.has{background:color-mix(in srgb,var(--c) 13%,var(--bg))}
.cell.has:hover{background:color-mix(in srgb,var(--c) 22%,var(--bg))}
.cell::after{content:"+";position:absolute;right:9px;bottom:6px;color:var(--mute);opacity:0;transition:opacity .2s;font-size:16px}
.cell:hover::after{opacity:1}
.cell.today::before{content:"";position:absolute;inset:3px;border-radius:10px;background:color-mix(in srgb,var(--c,transparent) 20%,var(--hi))}
.n{font-size:12px;font-weight:900}
.today .n::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1.8s ease-in-out infinite}
.out .n,.out .r{opacity:.4}
.r{display:flex;align-items:center;gap:7px;font-size:12px;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:6px;padding:4px 6px}
.r b{font-weight:700;flex:1;white-space:nowrap}
.r em{font-style:normal;color:var(--mute);font-size:11px;white-space:nowrap}
.r em.g{color:var(--good)}
.ic{width:14px;height:14px;border-radius:4px;background:var(--c,var(--acc));color:var(--aink);font-size:9px;font-style:normal;display:grid;place-items:center;flex:none}
.ic.h{background:linear-gradient(90deg,var(--mute) 50%,transparent 50%);border:1px solid var(--mute)}
.r.m span{flex:1;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid.w .cell{min-height:240px}.grid.d .cell{min-height:320px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.ov.show{opacity:1;visibility:visible}
.modal{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;transform:translateY(18px) scale(.97);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.ov.show .modal{transform:none}
.modal h3{margin:0 0 14px;font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.row label{flex:1}.modal input{width:100%}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;height:36px;border-radius:8px;background:var(--hi);font-weight:700}
.seg button.on{background:var(--acc);color:var(--aink)}
.sw3{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.sq{width:30px;height:30px;border-radius:50%;font-size:12px;display:grid;place-items:center;transition:transform .2s}
.sq:hover{transform:scale(1.15)}.sq.on{outline:2px solid var(--ink);outline-offset:2px}
.hrs{font-size:13px;color:var(--mute);margin:2px 0 14px}
.btns{display:flex;gap:8px}.btns button{height:36px;padding:0 14px;border-radius:8px;background:var(--hi);font-weight:700}
.sig{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:26px}
.sig .ln{flex:1;height:1px;background:var(--line);transform-origin:left;animation:grow 1s .6s both}
.nm{font-family:"Dela Gothic One",sans-serif;font-size:26px;letter-spacing:.14em;color:var(--acc);display:flex}
.nm span{animation:fade .6s both;animation-delay:calc(var(--d)*.1s + .8s)}
.hk{width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:13px;animation:stamp .5s 1.3s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-25deg)}to{opacity:1;transform:none}}
@media(max-width:700px){.app{padding:12px 6px 30px}.bar{padding:0 6px}.cell{min-height:84px;padding:6px 3px}.r{padding:3px;gap:0}.r .ic,.r b{display:none}.r em{flex:1;text-align:center;font-size:10px}.r.m span{display:none}.dow .f{display:none}.dow .s{display:inline}.wk span{display:none}.cell::after{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<div class="bar">
  <div><h1><b id="tM"></b> <span id="tY"></span></h1><div class="sub" id="sub"></div></div>
  <div class="ctl">
    <button class="ib" id="prev" aria-label="Previous">‹</button>
    <button class="ib" id="next" aria-label="Next">›</button>
    <button class="pill" id="today">Today</button>
    <div class="wk"><span>Weekends</span><button class="sw" id="wk" aria-label="Toggle weekends"></button></div>
    <div class="seg2" id="modes"><button data-m="d">Day</button><button data-m="w">Week</button><button data-m="m">Month</button></div>
    <button class="ib" id="cfg" aria-label="Setup default shift"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    <button class="ib" id="tgl" aria-label="Toggle theme">◐</button>
  </div>
</div>

<div class="drawer" id="drawer"><div>
  <div class="setup">
    <label>Time in<input type="time" id="defIn"></label>
    <label>Time out<input type="time" id="defOut"></label>
    <label>Duty weekdays<div class="chips" id="chips"></div></label>
    <label>Day off weekdays<div class="chips" id="offchips"></div></label>
    <button class="pill pri" id="fill">Fill duty days</button>
    <button class="pill off" id="fillOff">Fill days off</button>
    <button class="pill" id="clear">Clear month</button>
  </div>
</div></div>

<div class="dows" id="dows"></div>
<div class="grid" id="grid"></div>
<footer class="sig"><div class="ln"></div><div class="nm" aria-label="Wade"><span style="--d:0">W</span><span style="--d:1">A</span><span style="--d:2">D</span><span style="--d:3">E</span></div><div class="hk">印</div></footer>
</div>

<div class="ov" id="ov"><div class="modal">
  <h3 id="mTitle"></h3>
  <div class="seg" id="seg"><button data-t="duty">Duty</button><button data-t="off">Day off</button></div>
  <div class="row"><label>Time in<input type="time" id="mIn"></label><label>Time out<input type="time" id="mOut"></label></div>
  <label style="margin-bottom:10px">Note<input type="text" id="mNote" placeholder="Ward 3, night shift…" maxlength="40"></label>
  <div class="hrs" id="mHrs"></div>
  <label>Day color</label><div class="sw3" id="sw"></div>
  <div class="btns"><button class="pri" id="mSave">Save</button><button id="mDel">Clear</button><button id="mX">Close</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],MS=MN.map(m=>m.slice(0,3)),DF=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],DS=DF.map(d=>d.slice(0,3));
let S={duties:{},def:{in:'08:00',out:'17:00'},wd:[1,2,3,4,5],owd:[0,6],wk:true,mode:'m'};
try{const r=localStorage.getItem('duty-cal-v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('duty-cal-v1',JSON.stringify(S))}catch(e){}};
let theme='dark';try{theme=localStorage.getItem('duty-theme')||'dark'}catch(e){}
const setTheme=t=>{theme=t;document.documentElement.dataset.theme=t;try{localStorage.setItem('duty-theme',t)}catch(e){}};
setTheme(theme);$('#tgl').onclick=()=>setTheme(theme==='dark'?'light':'dark');

let cur=new Date(),editing=null,mType='duty',mColor=null;
const PAL=[null,'#E6C384','#98BB6C','#7AA89F','#957FB8','#FFA066','#E46876'],OFFC='#E6C384';
const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const hrs=(i,o)=>(i&&o)?((mins(o)-mins(i)+1440)%1440)/60:0;
const fh=h=>(Number.isInteger(h)?h:h.toFixed(1))+'h';
const f12=t=>{let[h,m]=t.split(':').map(Number);const s=h>=12?'PM':'AM';return (h%12||12)+':'+pad(m)+' '+s};
const mon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const esc=s=>s.replace(/</g,'&lt;');

function dates(){
  const y=cur.getFullYear(),m=cur.getMonth(),out=[];
  if(S.mode==='d')return[new Date(y,m,cur.getDate())];
  let a,b;
  if(S.mode==='w'){a=mon(cur);b=new Date(a);b.setDate(a.getDate()+6)}
  else{a=mon(new Date(y,m,1));b=new Date(y,m+1,0);b.setDate(b.getDate()+((7-b.getDay())%7))}
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))if(S.wk||(d.getDay()%6))out.push(new Date(d));
  return out;
}
function render(){
  const y=cur.getFullYear(),m=cur.getMonth(),ds=dates(),now=new Date(),M=S.mode;
  let tM,tY=y;
  if(M==='m')tM=MN[m];
  else if(M==='w'){const a=mon(cur),b=new Date(a);b.setDate(a.getDate()+6);tM=MS[a.getMonth()]+' '+a.getDate()+' – '+(b.getMonth()!==a.getMonth()?MS[b.getMonth()]+' ':'')+b.getDate()}
  else tM=DF[(cur.getDay()+6)%7]+', '+MS[m]+' '+cur.getDate();
  $('#tM').textContent=tM;$('#tY').textContent=tY;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===M));
  $('#wk').classList.toggle('on',S.wk);$('#wk').style.opacity=M==='d'?.4:1;
  $('#defIn').value=S.def.in;$('#defOut').value=S.def.out;
  $('#chips').innerHTML=[1,2,3,4,5,6,0].map(i=>`<button class="chip ${S.wd.includes(i)?'on':''}" data-i="${i}">${DS[(i+6)%7][0]}</button>`).join('');
  $('#offchips').innerHTML=[1,2,3,4,5,6,0].map(i=>`<button class="chip o ${S.owd.includes(i)?'on':''}" data-i="${i}">${DS[(i+6)%7][0]}</button>`).join('');
  const cols=M==='d'?1:(S.wk?7:5);
  const head=M==='d'?[]:(S.wk?DF:DF.slice(0,5));
  $('#dows').style.gridTemplateColumns=$('#grid').style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  $('#dows').innerHTML=head.map((d,i)=>`<div class="dow"><span class="f">${d}</span><span class="s">${DS[i]}</span></div>`).join('');
  $('#grid').className='grid '+M;
  let html='',cnt=0,tot=0,off=0;
  ds.forEach((dt,i)=>{
    const k=key(dt),v=S.duties[k],isT=key(now)===k,inM=M!=='m'||dt.getMonth()===m;
    const lab=isT?`Today, ${MS[dt.getMonth()]} ${dt.getDate()}`:(dt.getDate()===1||i===0?`${MN[dt.getMonth()]} ${dt.getDate()}`:dt.getDate());
    let rows='',c='';
    if(v){c=v.color||(v.off?OFFC:'');
      if(v.off){if(inM)off++;rows=`<div class="r"><i class="ic">休</i><b>Day off</b><em style="color:var(--c)">OFF</em></div>${v.note?`<div class="r m"><i class="ic h"></i><span>${esc(v.note)}</span></div>`:''}`}
      else{const h=hrs(v.in,v.out);if(inM){cnt++;tot+=h}
        rows=`<div class="r"><i class="ic">→</i><b>In</b><em>${f12(v.in)}</em></div><div class="r"><i class="ic">←</i><b>Out</b><em>${f12(v.out)}</em></div><div class="r m"><i class="ic h"></i><span>${v.note?esc(v.note):'Shift'}</span><em class="g">${fh(h)}</em></div>`}
    }
    const st=`--i:${i}${v?';--c:'+(c||'var(--acc)'):''}`;
    html+=`<button class="cell ${v?'has':''} ${isT?'today':''} ${inM?'':'out'}" style="${st}" data-k="${k}" data-l="${MS[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}"><div class="n">${lab}</div>${rows}</button>`;
  });
  $('#grid').innerHTML=html;
  $('#sub').textContent=`${cnt} duty day${cnt===1?'':'s'} · ${fh(tot)} · ${off} off`;
}
const step=n=>{const y=cur.getFullYear(),m=cur.getMonth(),d=cur.getDate();
  cur=S.mode==='m'?new Date(y,m+n,1):new Date(y,m,d+(S.mode==='w'?7*n:n));render()};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#today').onclick=()=>{cur=new Date();render()};
$('#modes').onclick=e=>{const b=e.target.closest('button');if(b){S.mode=b.dataset.m;save();render()}};
$('#wk').onclick=()=>{S.wk=!S.wk;save();render()};
$('#cfg').onclick=()=>$('#drawer').classList.toggle('open');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const i=+b.dataset.i;S.wd=S.wd.includes(i)?S.wd.filter(x=>x!==i):[...S.wd,i];save();b.classList.toggle('on')};
$('#offchips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const i=+b.dataset.i;S.owd=S.owd.includes(i)?S.owd.filter(x=>x!==i):[...S.owd,i];save();b.classList.toggle('on')};
$('#defIn').onchange=e=>{S.def.in=e.target.value;save()};
$('#defOut').onchange=e=>{S.def.out=e.target.value;save()};
$('#fill').onclick=()=>{const y=cur.getFullYear(),m=cur.getMonth(),dim=new Date(y,m+1,0).getDate();
  for(let d=1;d<=dim;d++){const dt=new Date(y,m,d);if(S.wd.includes(dt.getDay())){const k=key(dt);if(!S.duties[k])S.duties[k]={in:S.def.in,out:S.def.out,note:''}}}
  save();render()};
$('#fillOff').onclick=()=>{const y=cur.getFullYear(),m=cur.getMonth(),dim=new Date(y,m+1,0).getDate();
  for(let d=1;d<=dim;d++){const dt=new Date(y,m,d);if(S.owd.includes(dt.getDay())){const k=key(dt);if(!S.duties[k])S.duties[k]={off:true,note:''}}}
  save();render()};
$('#clear').onclick=()=>{const p=key(new Date(cur.getFullYear(),cur.getMonth(),1)).slice(0,8);
  Object.keys(S.duties).forEach(k=>{if(k.startsWith(p))delete S.duties[k]});save();render()};

function openEd(k,l){
  editing=k;const v=S.duties[k]||{};mType=v.off?'off':'duty';mColor=v.color||null;
  $('#mTitle').textContent=l;$('#mIn').value=v.in||S.def.in;$('#mOut').value=v.out||S.def.out;$('#mNote').value=v.note||'';
  upd();$('#ov').classList.add('show');
}
const upd=()=>{const off=mType==='off';
  $('#mHrs').textContent=off?'':'Shift length: '+fh(hrs($('#mIn').value,$('#mOut').value));
  $('#mHrs').style.display=off?'none':'';$('#mIn').closest('.row').style.display=off?'none':'';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===mType));
  $('#sw').innerHTML=PAL.map(c=>`<button class="sq ${c===mColor?'on':''}" data-c="${c||''}" style="background:${c||'var(--hi)'}" aria-label="Color">${c?'':'✕'}</button>`).join('')};
const close=()=>{$('#ov').classList.remove('show');editing=null};
$('#grid').onclick=e=>{const c=e.target.closest('.cell');if(c)openEd(c.dataset.k,c.dataset.l)};
$('#mIn').oninput=$('#mOut').oninput=upd;
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b){mType=b.dataset.t;upd()}};
$('#sw').onclick=e=>{const b=e.target.closest('.sq');if(b){mColor=b.dataset.c||null;upd()}};
$('#mSave').onclick=()=>{if(!editing)return;S.duties[editing]={in:$('#mIn').value,out:$('#mOut').value,note:$('#mNote').value.trim(),off:mType==='off',color:mColor};save();close();render()};
$('#mDel').onclick=()=>{if(editing){delete S.duties[editing];save()}close();render()};
$('#mX').onclick=close;$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
render();
</script>
</body>
</html>
